[package]
name = "doll-parser"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Filtro de Doll: notas Markdown por stdin, fragmentos, enlaces y frontmatter por stdout"
publish = false

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"

[profile.release]
lto = true
strip = true
