[project]
name = "doll"
version = "0.4.0"
description = "RAG local sobre notas Markdown, con citas verificadas por código"
authors = [
    { name = "RemLam" }
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bakers",
    "doll-parser",
]

[project.scripts]
doll = "doll.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
bakers = { git = "https://github.com/RemiH06/Bakery.git", subdirectory = "bakers" }
doll-parser = { path = "parser" }
